nooa_agent:
  responses_api_agents:
    nooa_agent:
      entrypoint: app.py
      num_workers: 1
      model_server:
        type: responses_api_models
        name: policy_model
      nooa:
        agent_class: nooa_bench.bench_agent:BenchAgent
        # Sandboxed execution: `await agent.<turn_method>(task_text)` inside the task sandbox, run by
        # nooa_bench.gym_worker on the staged NOOA runtime. Any NOOA agent class works here.
        turn_method: _solve_task
        tool_binding: null         # module:callable(agent, tools) replacing the default tool translation
        # Embedded execution only: the adapter runs in this server.
        invocation_adapter: responses_api_agents.nooa_agent.bench_agent_adapter:invoke_bench_agent
        init_kwargs: {}
        execution_mode: embedded
        # execution_mode: sandboxed  # Requires Resources-provided sandbox_access.
      max_policy_calls: null
      # NOOA's own instrumentation in the sandbox, saved per rollout. ATIF trajectories and OTLP span
      # files are archived into artifacts_output/<rollout_id>.tar.gz after each episode; otlp_endpoint
      # (default: OTEL_EXPORTER_OTLP_ENDPOINT, the collector Gym's telemetry uses) also ships spans live.
      tracing:
        atif: true
        trace_jsonl: true
        otlp_endpoint: null
        artifacts_output: nooa-artifacts
      # Worker ceiling is below the episode timeout; setup can still make the episode deadline fire first.
      sandbox_runner_timeout_seconds: 21420
      session_close_timeout_seconds: 30

# Recipes bind Resources and rename this instance through _inherit_from.
nooa_environment_server:
  environment_servers:
    single_agent_turn:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: ???
      agent_server:
        type: responses_api_agents
        name: nooa_agent
      default_episode_timeout_seconds: 21600
      cleanup_timeout_seconds: 180
